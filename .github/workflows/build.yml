name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Installer la carte et les libs
        run: |
          arduino-cli config init
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32
          arduino-cli lib install M5Unified M5GFX
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP
          arduino-cli lib install --git-url https://github.com/ESP32Async/ESPAsyncWebServer
      - name: Préparer le croquis
        run: |
          mkdir -p sketch/M5_Arcade
          cp M5_Arcade.ino sketch/M5_Arcade/
      - name: Trouver la carte StickS3
        run: |
          arduino-cli board listall m5stack | grep -i stick
          FQBN=$(arduino-cli board listall m5stack | grep -i "sticks3" | head -1 | awk '{print $NF}')
          echo "FQBN trouvé : $FQBN"
          test -n "$FQBN"
          echo "FQBN=$FQBN" >> $GITHUB_ENV
      - name: Compiler
        run: arduino-cli compile --fqbn "$FQBN" --output-dir out sketch/M5_Arcade
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.bin
